<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background: #ffffff;
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 1920px;
    height: 1080px;
  }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
window.DUR = 404.60;
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');

const logoSello = new Image();
logoSello.src = '../../sello educai.jpg';
let assetsLoaded = 0;
function checkReady() {
  assetsLoaded++;
  if (assetsLoaded >= 1) window.READY = true;
}
logoSello.onload = checkReady;
logoSello.onerror = checkReady;

// Palette (EducAI Brand Palette)
const C_DARK     = '#1e293b';
const C_BLUE     = '#0284c7';
const C_ROSE     = '#fd2e66';
const C_PURPLE   = '#5952f8';
const C_AMBER    = '#f59e0b';
const C_GREEN    = '#10b981';
const C_GREY     = '#64748b';
const C_BORDER   = '#cbd5e1';

function smoothstep(min, max, value) {
  let x = Math.max(0, Math.min(1, (value - min) / (max - min)));
  return x * x * (3 - 2 * x);
}

// 7 Scenes Timing
// sc1: 0.0 - 54.67 (start: 0)
// sc2: 55.22 - 110.35 (start: 55.22)
// sc3: 110.90 - 169.60 (start: 110.90)
// sc4: 170.15 - 228.73 (start: 170.15)
// sc5: 229.28 - 286.23 (start: 229.28)
// sc6: 286.78 - 346.06 (start: 286.78)
// sc7: 346.61 - 404.60 (start: 346.61)

window.render = function(t) {
  ctx.clearRect(0, 0, 1920, 1080);

  // Background
  let bg = ctx.createLinearGradient(0, 0, 1920, 1080);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.5, '#fcfcfd');
  bg.addColorStop(1, '#f8fafc');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 1920, 1080);

  // Subtle Sheen
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.beginPath();
  let shift = (t * 10) % 700;
  ctx.moveTo(shift - 250, 0);
  ctx.lineTo(shift + 350, 0);
  ctx.lineTo(shift + 50, 1080);
  ctx.lineTo(shift - 550, 1080);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Pin grid
  ctx.save();
  ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
  for (let x = 60; x < 1920; x += 120) {
    for (let y = 60; y < 1080; y += 120) {
      ctx.beginPath();
      ctx.arc(x, y, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();

  // Header
  ctx.save();
  if (logoSello.complete && logoSello.naturalWidth > 0) {
    ctx.drawImage(logoSello, 80, 40, 80, 80);
  }
  ctx.font = 'bold 30px "Segoe UI", sans-serif';
  ctx.fillStyle = C_DARK;
  ctx.fillText("EducAI · Debate Sociotécnico y Andragogía", 185, 75);
  ctx.font = '600 20px "Segoe UI", sans-serif';
  ctx.fillStyle = C_BLUE;
  ctx.fillText("CUANDO EL TRABAJO DEJA DE SER NECESARIO: IA, IDENTIDAD Y SOCIEDAD", 185, 105);
  ctx.restore();

  // SCENE ROUTING
  if (t < 55.0) {
    renderScene01(t);
  } else if (t < 110.5) {
    renderScene02(t - 55.22);
  } else if (t < 170.0) {
    renderScene03(t - 110.90);
  } else if (t < 229.0) {
    renderScene04(t - 170.15);
  } else if (t < 286.5) {
    renderScene05(t - 229.28);
  } else if (t < 346.5) {
    renderScene06(t - 286.78);
  } else {
    renderScene07(t - 346.61);
  }

  // Persistent Subtitles Banner
  drawSubtitles(t);
};

  ctx.fillText("Más allá del salario: el organizador histórico del tiempo, los vínculos y la identidad", 960, 240);
  ctx.textAlign = 'left';

  // 4 Pilares
  const cards = [
    { title: "⏰ Estructura Temporal", desc: "Organiza el ritmo de vida cotidiano y los horizontes a futuro.", col: C_BLUE, x: 180, y: 310 },
    { title: "🤝 Reconocimiento Social", desc: "La pregunta '¿a qué te dedicás?' sitúa al individuo en el tejido colectivo.", col: C_PURPLE, x: 980, y: 310 },

  ];

  cards.forEach(c => {
    ctx.strokeStyle = c.col;
    ctx.lineWidth = 3;
    ctx.strokeRect(c.x, c.y, 760, 190);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(c.x, c.y, 760, 190);

    ctx.font = 'bold 28px "Segoe UI", sans-serif';
    ctx.fillStyle = c.col;
    ctx.fillText(c.title, c.x + 40, c.y + 60);

    ctx.font = '22px "Segoe UI", sans-serif';
    ctx.fillStyle = C_DARK;
    ctx.fillText(c.desc, c.x + 40, c.y + 115);
  });

  ctx.restore();
}

  { start: 82.0, end: 95.0, text: "La capacidad de adaptación forzada reemplazó al oficio: la pregunta ya no es qué sé hacer, sino qué debo aprender hoy." },
  { start: 95.0, end: 110.3, text: "Un sistema ultra-dinámico que, paradójicamente, erosiona el carácter y destruye la estabilidad profesional." },

  // Scene 3
  { start: 110.9, end: 124.0, text: "Byung-Chul Han, en 'La sociedad del cansancio', nos revela cómo el trabajo mutó hacia la autoexplotación voluntaria." },
  { start: 124.0, end: 138.0, text: "Convertidos en empresarios de nosotros mismos, la exigencia no viene de afuera, sino de la ilusión de libertad." },
  { start: 138.0, end: 153.0, text: "La paradoja de la IA: si una tarea se hace en 1 hora en vez de 4, no descansamos: se nos exigen tres informes más." },
  { start: 153.0, end: 169.6, text: "La tecnología no reduce la jornada laboral; eleva las expectativas y profundiza la presión del rendimiento." },

  // Scene 4
  { start: 170.1, end: 184.0, text: "La IA introduce una diferencia cualitativa: no solo amplía la fuerza o el cálculo, sino que co-decide con nosotros." },
  { start: 184.0, end: 198.0, text: "Como analiza Yuval Noah Harari en 'Nexus', la IA es una inteligencia ajena que opera como una caja negra opaca." },
  { start: 198.0, end: 213.0, text: "Surge la alienación cognitiva: delegamos el criterio técnico en el algoritmo, pero conservamos la responsabilidad legal." },
  { start: 213.0, end: 228.7, text: "Médicos, abogados y directivos siguen respondiendo penalmente por resultados producidos por sistemas que no controlan." },

  // Scene 5
  { start: 229.3, end: 243.0, text: "Al combinarse la IA con la robótica, se rompe la cadena histórica: trabajo, salario, consumo e integración." },
  { start: 243.0, end: 257.0, text: "La paradoja del capitalismo automatizado: el ser humano deja de ser necesario como trabajador, pero sigue siendo vital como consumidor." },
  { start: 257.0, end: 271.0, text: "El Ingreso Básico Universal puede asegurar la subsistencia física y sostener el mercado, pero deja vacante el sentido." },
  { start: 271.0, end: 286.2, text: "El dinero alimenta el cuerpo, pero no responde a quiénes somos ni para qué nos levantamos por la mañana." },

  // Scene 6
  { start: 286.8, end: 301.0, text: "En 'Ready Player One', la humanidad precarizada migra su existencia entera al universo virtual del OASIS." },
  { start: 301.0, end: 315.0, text: "Es la transición histórica: del Homo laborans que produce, al Homo consumens que compra, y al Homo virtualis digital." },
  { start: 315.0, end: 330.0, text: "Cuando el mundo real pierde su promesa de integración, la tecnología actúa como un analgésico existencial masivo." },
  { start: 330.0, end: 346.0, text: "¿Qué ocurre con la condición humana cuando la vida entera transcurre en la ficción de una simulación?" },

  // Scene 7
  { start: 346.6, end: 360.0, text: "De la inestabilidad de Sennett y el cansancio de Han, pasamos a la amenaza definitiva: el vacío post-laboral." },
  { start: 360.0, end: 375.0, text: "La pregunta no es cuántos empleos destruirá la máquina, sino quiénes seremos cuando trabajar ya no nos defina." },
  { start: 375.0, end: 390.0, text: "El desafío educativo de EducAI no es competir en velocidad con la máquina, sino cultivar el juicio crítico y la comunidad." },
  { start: 390.0, end: 404.6, text: "La cuestión última no es qué harán las máquinas con nuestro trabajo, sino qué haremos nosotros con nuestra libertad." }
];

function drawSubtitles(t) {
  let active = subs.find(s => t >= s.start && t < s.end);
  if (!active) return;

  ctx.save();
  ctx.font = '600 24px "Segoe UI", sans-serif';
  let textWidth = ctx.measureText(active.text).width;
  let boxW = Math.min(1800, textWidth + 60);
  let boxH = 52;
  let boxX = (1920 - boxW) / 2;
  let boxY = 1010;

  ctx.fillStyle = 'rgba(15, 23, 42, 0.90)';
  ctx.beginPath();
  ctx.roundRect(boxX, boxY, boxW, boxH, 10);
  ctx.fill();

  ctx.strokeStyle = C_BLUE;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.fillText(active.text, 1920 / 2, boxY + 35);
  ctx.restore();
}
